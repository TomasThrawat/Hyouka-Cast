name: Hyouka Cast Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  flutter-ci:
    uses: TomasThrawat/hyouka-flutter-workflows/.github/workflows/flutter-ci.yml@ccb67192213f010f32072a3ef66ca4b3f7538366
    with:
      run-analyze: true
      run-tests: true
      build-apk: true
      target-platform: android-arm64
      generate-android: true
      android-project-name: hyouka_cast
      android-organization: com.hyouka
      run-security-audit: true
      artifact-name: hyouka-cast-arm64-v8a
