name: Hyouka Cast Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write
  attestations: write

jobs:
  build-arm32:
    uses: TomasThrawat/hyouka-flutter-workflows/.github/workflows/flutter-ci.yml@4bbf68efd254bc02c4b5a4c3eed76e772e81cad6
    with:
      run-analyze: true
      run-tests: true
      check-format: false
      build-apk: true
      target-platform: android-arm
      generate-android: true
      android-project-name: hyouka_cast
      android-organization: com.hyouka
      run-emulator-tests: false
      run-security-audit: true
      fail-on-security-findings: false
      artifact-name: hyouka-cast-armeabi-v7a
      enable-targeted-pr-tests: false
      run-apk-smoke-test: false
      min-coverage-percent: 0
      max-apk-size-mb: 0
      max-apk-entry-size-mb: 0
      forbid-permissions: ''
      fail-on-new-warnings: false
      generate-artifact-attestation: false

  build-arm64:
    uses: TomasThrawat/hyouka-flutter-workflows/.github/workflows/flutter-ci.yml@4bbf68efd254bc02c4b5a4c3eed76e772e81cad6
    with:
      run-analyze: true
      run-tests: true
      check-format: false
      build-apk: true
      target-platform: android-arm64
      generate-android: true
      android-project-name: hyouka_cast
      android-organization: com.hyouka
      run-emulator-tests: false
      run-security-audit: false
      fail-on-security-findings: false
      artifact-name: hyouka-cast-arm64-v8a
      enable-targeted-pr-tests: false
      run-apk-smoke-test: false
      min-coverage-percent: 0
      max-apk-size-mb: 0
      max-apk-entry-size-mb: 0
      forbid-permissions: ''
      fail-on-new-warnings: false
      generate-artifact-attestation: false
