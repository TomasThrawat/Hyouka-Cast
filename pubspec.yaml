name: hyouka_cast
description: Pure-black local Wi-Fi Android screen mirroring.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.2+hotfix.4
  flutter_background: ^1.3.1
  cast_android:
    path: packages/cast_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_webrtc:
    git:
      url: https://github.com/TomasThrawat/hyouka-cast-webrtc-android.git
      ref: 0a51dc9192c881e0f919ff01ea5734d2e9cc1b98

flutter:
  uses-material-design: true
