group 'com.hyouka.cast_android'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'

android {
    namespace 'com.hyouka.cast_android'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
